spring:
  application:
    name: carm-facility-capital-markers
  data:
    mongodb:
      database: carm_fcm
      port: 0
      auto-index-creation: false
  thymeleaf:
    cache: true

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: false

info:
  app:
    name: CARM Facility Capital Markers
    version: 2026.08
    buildTimestamp: ${BUILD_TIMESTAMP:local}

ldap:
  initialContextFactory: com.sun.jndi.ldap.LdapCtxFactory
  providerUrl: ldap://localhost:389
  securityProtocol:
  securityAuthentication: simple
  peopleDirectory: ou=people,dc=company,dc=com
  connectionTimeoutMillis: 5000
  readTimeoutMillis: 5000
  bindUsername: sa-svc-carm-bind
  bindPassword: ENC(BIND-ACCOUNT-ENCRYPTED-PASSWORD)

security:
  authenticationMode: ldap
  passwordPolicy:
    enabled: false
  token:
    expirationSeconds: 1800
    refreshWindowSeconds: 300
    sameOriginRequired: false
  roles:
    admin:
      - sa-svc-carm-admin
    api:
      - sa-svc-carm-api
    audit:
      - sa-svc-carm-audit
    itsup:
      - sa-svc-carm-itsup

mongodb:
  validateConnection: true
  initializeCollections: true
  initializeIndexes: true

  dbCollectionNames:

    facilityCapitalMarkers:
      name: facilityCapitalMarkers
      createIfMissing: true
      indexes:
        - name: facility_capital_markers_business_key
          fields:
            relationshipId: 1
            serialNo: 1
            facilityNo: 1
          unique: true

        - name: facility_capital_markers_credit_application
          fields:
            relationshipId: 1
            serialNo: 1
          unique: false

    facilityCapitalMarkersHistory:
      name: facilityCapitalMarkersHistory
      createIfMissing: true
      indexes: []

    creditApplicationConsent:
      name: creditApplicationConsent
      createIfMissing: true
      indexes:
        - name: credit_application_consent_business_key
          fields:
            relationshipId: 1
            serialNo: 1
          unique: true

    apiAudit:
      name: apiAudit
      createIfMissing: true
      indexes:
        - name: api_audit_trace
          fields:
            correlationId: 1
            transactionId: 1
          unique: false

        - name: api_audit_credit_application_time
          fields:
            relationshipId: 1
            serialNo: 1
            timestamp: -1
          unique: false

    auditRecords:
      name: audit_records
      createIfMissing: true
      indexes:
        - name: audit_event_type
          fields:
            eventType: 1
          unique: false

        - name: audit_result
          fields:
            result: 1
          unique: false

        - name: audit_username
          fields:
            username: 1
          unique: false

    applicationVersion:
      name: applicationVersion
      createIfMissing: true
      indexes:
        - name: version
          fields:
            version: 1
          unique: true

    referenceDataMappings:
      name: referenceDataMappings
      createIfMissing: true
      indexes: []

    facilityTypeMaintenance:
      name: facilityTypeMaintenance
      createIfMissing: true
      indexes:
        - name: facility_type_code
          fields:
            facilityTypeCode: 1
          unique: true

    purposeCodeMaintenance:
      name: purposeCodeMaintenance
      createIfMissing: true
      indexes:
        - name: purpose_code_business_key
          fields:
            purposeCodeHub: 1
            purposeCodeCarm: 1
          unique: true

    maintenanceHistory:
      name: maintenanceHistory
      createIfMissing: true
      indexes: []

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.mongodb.driver: INFO
    com.sab.carm.fcm: INFO

carm:
  api:
    base-url: https://{hostname}
    reference-data-path: /CarmDataService/referenceTable/data
    method: POST
    content-type: application/json
  site-id: ABCD
  reference-data:
    tables:
      - "1200"
      - "1060"
    defaults:
      facility-type:
        advised: "Y"
        committed: "Y"
      purpose-code:
        unconditional-cancellable: "Y"
