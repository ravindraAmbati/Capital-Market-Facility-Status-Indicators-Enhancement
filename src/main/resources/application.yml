################################################################################
# Spring Boot
################################################################################

spring:
  application:
    name: carm-facility-capital-markers

  data:
    mongodb:
      uri: ENC(ENCRYPTED_MONGODB_CONNECTION_STRING)
      auto-index-creation: false

  thymeleaf:
    cache: false

################################################################################
# Server
################################################################################

server:
  port: 8080

  servlet:
    session:
      timeout: 30m

################################################################################
# Management
################################################################################

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

################################################################################
# Application Information
################################################################################

info:
  app:
    name: CARM Facility Capital Markers
    version: 2026.08
    buildTimestamp: ${BUILD_TIMESTAMP:local}

################################################################################
# LDAP
################################################################################

ldap:
  initialContextFactory: com.sun.jndi.ldap.LdapCtxFactory
  providerUrl: ldap://localhost:389
  securityProtocol:
  securityAuthentication: simple
  peopleDirectory: ou=people,dc=company,dc=com
  connectionTimeoutMillis: 5000
  readTimeoutMillis: 5000

################################################################################
# Security
################################################################################

security:
  authenticationMode: ldap

  passwordPolicy:
    enabled: false

  token:
    expirationSeconds: 1800
    refreshWindowSeconds: 300
    sameOriginRequired: false

  roles:
    admin:
      - sa-svc-carm-fcm-admin

    api:
      - sa-svc-carm-fcm-api

    audit:
      - sa-svc-carm-fcm-audit

    itsup:
      - sa-svc-carm-fcm-itsup

################################################################################
# MongoDB Collections
################################################################################

mongodb:
  collections:
    facilityCapitalMarkers: facilityCapitalMarkers
    facilityCapitalMarkersDecisionHistory: facilityCapitalMarkersDecisionHistory
    creditApplicationCapitalMarkersReport: creditApplicationCapitalMarkersReport
    applicationAuditLog: applicationAuditLog

################################################################################
# Swagger
################################################################################

springdoc:
  swagger-ui:
    path: /swagger-ui.html

################################################################################
# Logging
################################################################################

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.mongodb.driver: INFO
    com.sab.carm.fcm: DEBUG